[package]
name = "devkit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "devkit"

[[bin]]
name = "devkit"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
slint-build = { version = "1.18" }

[package.metadata.android]
package = "it.mtreconsulting.devkit"
apk_name = "devkit"
label = "DevKit"
resources = "res"
target_archs = ["arm64-v8a", "armeabi-v7a", "x86_64"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "DevKit"
icon = "@mipmap/ic_launcher"
round_icon = "@mipmap/ic_launcher_round"
