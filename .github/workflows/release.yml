name: Release APK

# ==============================================================================
# GitHub Actions CI/CD Workflow: DevKit Release APK
#
# Trigger:
# - Tag push matching 'v*' (e.g. v0.1.0):
#   - Builds signed release APK
#   - Uploads APK as workflow artifact ('devkit-apk')
#   - Creates a GitHub Release and attaches target/release/apk/devkit.apk
#
# ==============================================================================
# REQUIRED GITHUB REPOSITORY SECRETS
# Configure under: Settings -> Secrets and variables -> Actions
#
# 1. ANDROID_KEYSTORE_BASE64:
#    Base64-encoded release keystore file (.keystore or .jks).
#    Generate using: base64 -w 0 your-release.keystore
#
# 2. ANDROID_KEYSTORE_PASSWORD:
#    The password to unlock the keystore file.
#
# 3. ANDROID_KEY_ALIAS:
#    The alias of the key inside the keystore used for signing.
#
# 4. ANDROID_KEY_PASSWORD:
#    The password for the key alias.
# ==============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Fail Fast — Validate required signing secrets before toolchains
      # ------------------------------------------------------------------------
      - name: Verify required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing or empty"
            missing=1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty"
            missing=1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS is missing or empty"
            missing=1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD is missing or empty"
            missing=1
          fi
          if [ $missing -ne 0 ]; then
            echo "::error::Missing required signing secrets. Please configure them in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required signing secrets are present."

      # ------------------------------------------------------------------------
      # Step 2: Checkout repository
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 3: Setup Java 17 (required for apksigner and Android build tools)
      # ------------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ------------------------------------------------------------------------
      # Step 4: Install Android SDK platform & NDK via sdkmanager
      # ------------------------------------------------------------------------
      - name: Install Android SDK and NDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          # Add cmdline-tools and platform-tools to PATH
          if [ -d "$ANDROID_ROOT/cmdline-tools/latest/bin" ]; then
            CMDLINE_BIN="$ANDROID_ROOT/cmdline-tools/latest/bin"
          else
            CMDLINE_BIN=$(dirname "$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)")
          fi

          export PATH="$CMDLINE_BIN:$ANDROID_ROOT/platform-tools:$PATH"
          echo "$CMDLINE_BIN" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

          # Accept SDK licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Install / verify required platform and build-tools
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

          # Detect or install Android NDK
          if [ -d "$ANDROID_ROOT/ndk" ] && [ -n "$(ls -A "$ANDROID_ROOT/ndk" 2>/dev/null)" ]; then
            NDK_DIR=$(find "$ANDROID_ROOT/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            echo "Found pre-installed NDK at: $NDK_DIR"
          else
            echo "Installing NDK via sdkmanager..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_ROOT/ndk/27.2.12479018"
          fi

          # Add build-tools to PATH for apksigner and zipalign
          BUILD_TOOLS_DIR=$(find "$ANDROID_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            export PATH="$BUILD_TOOLS_DIR:$PATH"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

          # Export SDK and NDK paths to GitHub Environment
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "Using Android SDK at: $ANDROID_ROOT"
          echo "Using Android NDK at: $NDK_DIR"

      # ------------------------------------------------------------------------
      # Step 5: Install Rust toolchain with aarch64-linux-android target
      # ------------------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ------------------------------------------------------------------------
      # Step 6: Cache cargo-apk binary to avoid reinstalling on every run
      # ------------------------------------------------------------------------
      - name: Cache cargo-apk binary
        id: cache-cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: ${{ runner.os }}-cargo-apk-0.10.0

      # ------------------------------------------------------------------------
      # Step 7: Install cargo-apk if not cached
      # ------------------------------------------------------------------------
      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --version 0.10.0

      # ------------------------------------------------------------------------
      # Step 8: Cache Rust build dependencies
      # ------------------------------------------------------------------------
      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          targets: aarch64-linux-android

      # ------------------------------------------------------------------------
      # Step 9: Decode release keystore from GitHub Secret
      # ------------------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /home/runner/.android
          echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/.android/release.keystore

      # ------------------------------------------------------------------------
      # Step 10: Build release APK
      # ------------------------------------------------------------------------
      - name: Build release APK
        run: |
          cargo apk build --target aarch64-linux-android --lib --release

      # ------------------------------------------------------------------------
      # Step 11: Sign release APK with apksigner
      # ------------------------------------------------------------------------
      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apksigner sign \
            --ks /home/runner/.android/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            target/release/apk/devkit.apk
          apksigner verify --verbose target/release/apk/devkit.apk

      # ------------------------------------------------------------------------
      # Step 12: Verify release APK exists
      # ------------------------------------------------------------------------
      - name: Verify release APK exists
        run: |
          if [ ! -f target/release/apk/devkit.apk ]; then
            echo "::error::Release APK not found at target/release/apk/devkit.apk"
            ls -la target/release/apk/ || true
            exit 1
          fi
          echo "Verified release APK at target/release/apk/devkit.apk"
          ls -lh target/release/apk/devkit.apk

      # ------------------------------------------------------------------------
      # Step 13: Upload APK as workflow artifact (always produced)
      # ------------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devkit-apk
          path: target/release/apk/devkit.apk
          if-no-files-found: error

      # ------------------------------------------------------------------------
      # Step 14: Create GitHub Release on tag push (v*)
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/apk/devkit.apk
          generate_release_notes: true

      # ------------------------------------------------------------------------
      # Step 15: Defense-in-depth keystore cleanup (always runs)
      # ------------------------------------------------------------------------
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f /home/runner/.android/release.keystore
